<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg">

    <h1 class="text-4xl font-bold text-orange-600 text-center mb-8">
        Add Product
    </h1>

    <form method="POST" class="space-y-5">

        <input type="text"
               name="name"
               placeholder="Product Name"
               required
               class="w-full border p-4 rounded-xl">

        <input type="number"
               step="0.01"
               name="price"
               placeholder="Price"
               required
               class="w-full border p-4 rounded-xl">

        <input type="text"
               name="image"
               placeholder="images/product.jpg"
               required
               class="w-full border p-4 rounded-xl">

        <button type="submit"
                class="w-full bg-orange-600 hover:bg-red-700 text-white py-4 rounded-full text-xl font-bold">
            Add Product
        </button>

    </form>

</div>

</body>
</html>
