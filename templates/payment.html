<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment | Hungry Hare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-orange-600 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <h1 class="text-2xl font-bold">Hungry Hare 🍔</h1>
    <a href="{{ url_for('home') }}" class="bg-white text-orange-600 px-5 py-2 rounded-full font-bold">
        ← Back Home
    </a>
</nav>

<section class="min-h-screen flex items-center justify-center px-6">
    <div class="bg-white max-w-xl w-full p-8 rounded-3xl shadow-xl">

        <h1 class="text-4xl font-bold text-orange-600 mb-4 text-center">
            Payment 💳
        </h1>

        <p class="text-gray-600 text-center mb-8">
            Complete your order securely.
        </p>

        <form class="space-y-5">

            <input type="text" placeholder="Cardholder Name"
            class="w-full border p-4 rounded-xl">

            <input type="text" placeholder="Card Number"
            class="w-full border p-4 rounded-xl">

            <div class="grid grid-cols-2 gap-4">
                <input type="text" placeholder="MM/YY"
                class="w-full border p-4 rounded-xl">

                <input type="text" placeholder="CVV"
                class="w-full border p-4 rounded-xl">
            </div>

            <button type="button"
            onclick="alert('Payment successful! Order placed.')"
            class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-full text-xl font-bold">
                Pay Now
            </button>

        </form>

    </div>
</section>

</body>
</html>
